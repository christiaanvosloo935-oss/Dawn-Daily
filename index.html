<style>
/* Layout idea: a single-theme (light) broadsheet front page. Nameplate, dateline rule,
   lead story across the top, then sections in ruled columns. Each story is a <details>
   that opens in place. */
:root {
  --paper: #f7f6f1;
  --ink: #141413;
  --muted: #5d5c57;
  --rule: #1c1c1a;
  --hair: #cfcdc4;
  --wash: #ecebe4;
  --accent: #a3161d;
  --display: "Playfair Display", "Times New Roman", Georgia, serif;
  --body: "Source Serif 4", Georgia, "Times New Roman", serif;
  --label: "Libre Franklin", "Helvetica Neue", Arial, sans-serif;
  --nameplate: "UnifrakturMaguntia", "Old English Text MT", "Times New Roman", serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--paper); color: var(--ink); }
body { font-family: var(--body); font-size: 17px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
a { color: var(--accent); }
a:focus-visible, summary:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

.page { max-width: 1180px; margin: 0 auto; padding: 20px 24px 64px; }

/* Nameplate */
.ears { display: flex; justify-content: space-between; gap: 16px; font-family: var(--label); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.nameplate { text-align: center; margin: 6px 0 4px; }
.nameplate h1 { font-family: var(--nameplate); font-weight: 400; font-size: clamp(44px, 8vw, 92px); line-height: 1; margin: 0; letter-spacing: .01em; }
.motto { font-family: var(--body); font-style: italic; color: var(--muted); font-size: 14px; margin-top: 4px; }
.dateline { margin-top: 12px; border-top: 3px double var(--rule); border-bottom: 1px solid var(--rule); padding: 7px 0; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; font-family: var(--label); font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
.dateline .tools { display: flex; gap: 8px; }
.dateline button { font: inherit; letter-spacing: inherit; text-transform: inherit; background: transparent; color: var(--ink); border: 1px solid var(--rule); padding: 3px 9px; cursor: pointer; }
.dateline button:hover { background: var(--ink); color: var(--paper); }

/* Section index */
.index { display: flex; flex-wrap: wrap; gap: 4px 18px; justify-content: center; padding: 9px 0; border-bottom: 1px solid var(--hair); font-family: var(--label); font-size: 12px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; }
.index a { color: var(--ink); text-decoration: none; }
.index a:hover { color: var(--accent); }

/* Numbers strip */
.numbers { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); border-bottom: 1px solid var(--rule); }
.num { padding: 10px 14px; border-right: 1px solid var(--hair); }
.num:last-child { border-right: 0; }
.num .k { font-family: var(--label); font-size: 10.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.num .v { font-family: var(--display); font-weight: 700; font-size: 22px; font-variant-numeric: tabular-nums; line-height: 1.2; }
.num .n { font-size: 12.5px; color: var(--muted); line-height: 1.3; }

/* Stories */
details.story { border: 0; }
details.story > summary { list-style: none; cursor: pointer; }
details.story > summary::-webkit-details-marker { display: none; }
.kicker { font-family: var(--label); font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); display: block; margin-bottom: 4px; }
.headline { font-family: var(--display); font-weight: 700; line-height: 1.15; margin: 0 0 6px; text-wrap: balance; }
.dek { margin: 0; color: #2b2b29; }
.more { display: inline-flex; align-items: center; gap: 6px; margin-top: 8px; font-family: var(--label); font-size: 11.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.more::after { content: "+"; font-size: 14px; line-height: 1; }
details[open] .more { color: var(--accent); }
details[open] .more::after { content: "\2212"; }
.more .open-label { display: none; }
details[open] .more .open-label { display: inline; }
details[open] .more .closed-label { display: none; }
summary:hover .headline { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 4px; }
.body { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--hair); }
.body p { margin: 0 0 .8em; max-width: 68ch; }
.why { background: var(--wash); border-left: 3px solid var(--accent); padding: 10px 14px; margin: 4px 0 12px; font-size: 15.5px; max-width: 68ch; }
.why b { font-family: var(--label); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; display: block; margin-bottom: 2px; color: var(--accent); }
.sources { font-family: var(--label); font-size: 12px; color: var(--muted); }
.sources a { color: var(--muted); }
.sources a:hover { color: var(--accent); }

/* Lead */
.lead { display: grid; grid-template-columns: 1fr; padding: 22px 0 20px; border-bottom: 3px double var(--rule); }
.lead .headline { font-size: clamp(30px, 4.4vw, 50px); font-weight: 800; }
.lead .dek { font-size: 20px; line-height: 1.45; max-width: 62ch; }
.lead .body { columns: 2 320px; column-gap: 32px; column-rule: 1px solid var(--hair); }
.lead .body p, .lead .body .why { break-inside: avoid; }

/* Sections */
.sections { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0 40px; }
.section { padding-top: 20px; border-bottom: 1px solid var(--rule); padding-bottom: 8px; min-width: 0; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; border-bottom: 2px solid var(--rule); padding-bottom: 4px; margin-bottom: 4px; }
.section-head h2 { font-family: var(--label); font-size: 14px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; margin: 0; }
.section-head .count { font-family: var(--label); font-size: 11px; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
.section .story { padding: 14px 0; border-bottom: 1px solid var(--hair); }
.section .story:last-child { border-bottom: 0; }
.section .story:first-of-type .headline { font-size: 25px; }
.section .headline { font-size: 21px; }
.section .dek { font-size: 16.5px; }

/* Topic grid (home) and single-topic view */
.topics-title { font-family: var(--label); font-size: 13px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; margin: 22px 0 10px; padding-bottom: 4px; border-bottom: 2px solid var(--rule); display: flex; justify-content: space-between; align-items: baseline; }
.topics-title span { font-size: 11px; font-weight: 600; letter-spacing: .06em; color: var(--muted); }
.topics { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
.topic { display: flex; flex-direction: column; gap: 6px; min-height: 168px; padding: 12px 14px 14px; color: var(--ink); text-decoration: none; background: var(--wash); border: 1px solid var(--hair); border-top: 3px solid var(--rule); }
.topic:hover, .topic:focus-visible { border-top-color: var(--accent); background: #e4e3da; }
.topic .t-name { font-family: var(--label); font-size: 12.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
.topic .t-count { font-family: var(--display); font-weight: 800; font-size: 34px; line-height: 1; color: var(--accent); font-variant-numeric: tabular-nums; }
.topic .t-count small { font-family: var(--label); font-size: 10.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-left: 6px; }
.topic .t-top { font-family: var(--display); font-weight: 600; font-size: 14.5px; line-height: 1.25; color: #2b2b29; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
.topic .t-open { margin-top: auto; font-family: var(--label); font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.topic .t-open::after { content: " \2192"; }
.topic:hover .t-open { color: var(--accent); }
.sections { display: none; }
.section { display: none; }
body.in-topic .sections { display: block; max-width: 820px; margin: 0 auto; }
body.in-topic .section.active { display: block; }
body.in-topic .lead, body.in-topic .numbers, body.in-topic .topics-title, body.in-topic .topics, body.in-topic .archive { display: none; }
.index { display: none; }
body.in-topic .index { display: flex; position: sticky; top: 0; z-index: 5; background: var(--paper); flex-wrap: nowrap; overflow-x: auto; justify-content: flex-start; white-space: nowrap; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
body.in-topic .index::-webkit-scrollbar { display: none; }
.index a.back { color: var(--accent); position: sticky; left: 0; background: var(--paper); padding-right: 12px; box-shadow: 8px 0 8px -4px var(--paper); }
.index a.on { color: var(--accent); text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 5px; }

/* Source-lean bar */
.lean { margin: 14px 0 4px; padding-top: 12px; border-top: 1px solid var(--hair); max-width: 68ch; font-family: var(--label); }
.lean-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
.lean-head .verdict { color: var(--accent); }
.lean-head .rated { font-weight: 600; letter-spacing: .04em; color: var(--muted); text-transform: none; font-size: 11.5px; }
.lean-bar { display: flex; height: 12px; margin: 7px 0 6px; border: 1px solid var(--rule); background: var(--wash); }
.lean-bar i { display: block; height: 100%; }
.lean-bar i + i { border-left: 1px solid var(--paper); }
.lean-bar .c0 { background: #1f3f73; }
.lean-bar .c1 { background: #7c97c4; }
.lean-bar .c2 { background: #b9b6aa; }
.lean-bar .c3 { background: #d98a8d; }
.lean-bar .c4 { background: #a3161d; }
.lean-key { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }
.lean-key span:nth-child(2) { color: var(--muted); }
.lean-note { margin-top: 6px; font-size: 11px; color: var(--muted); line-height: 1.35; }

/* Lean filter (topic view) */
.filter { display: none; }
body.in-topic .filter { display: block; max-width: 820px; margin: 14px auto 0; font-family: var(--label); }
.filter-label { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
.filter-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.filter-chips button { font: inherit; font-size: 12px; font-weight: 600; letter-spacing: .04em; background: transparent; color: var(--ink); border: 1px solid var(--rule); padding: 5px 10px; cursor: pointer; border-radius: 0; }
.filter-chips button .n { color: var(--muted); font-weight: 500; margin-left: 4px; font-variant-numeric: tabular-nums; }
.filter-chips button:hover { background: var(--wash); }
.filter-chips button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.filter-chips button[aria-pressed="true"] .n { color: var(--hair); }
.filter-status { margin-top: 8px; font-size: 12px; color: var(--muted); }
.filter-status button { font: inherit; background: none; border: 0; padding: 0; color: var(--accent); text-decoration: underline; cursor: pointer; }
.section .story.filtered-out { display: none; }

/* Archive */
.archive { margin-top: 28px; border-top: 3px double var(--rule); padding-top: 12px; }
.archive h2 { font-family: var(--label); font-size: 13px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; margin: 0 0 8px; }
.archive ul { margin: 0; padding: 0; list-style: none; columns: 2 300px; column-gap: 32px; }
.archive li { padding: 5px 0; border-bottom: 1px solid var(--hair); break-inside: avoid; font-size: 15px; }
.archive li span { font-family: var(--label); font-size: 10.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); margin-right: 6px; }
.archive .empty { color: var(--muted); font-style: italic; font-size: 15px; }
.colophon { margin-top: 22px; font-family: var(--label); font-size: 11.5px; color: var(--muted); text-align: center; }

@media (max-width: 760px) {
  .page { padding: 14px 16px 48px; }
  .topics { grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .topic { min-height: 150px; padding: 10px 11px 12px; }
  .topic .t-top { font-size: 13.5px; -webkit-line-clamp: 4; }
  .ears { font-size: 10px; }
  .ears span:last-child { display: none; }
}
@media (prefers-reduced-motion: no-preference) {
  details[open] > .body { animation: unfold .18s ease-out; }
  @keyframes unfold { from { opacity: .4; transform: translateY(-3px); } to { opacity: 1; transform: none; } }
}
</style>
</head>
<body>
<div class="page" id="top">
  <div class="ears"><span id="ear-left"></span><span id="ear-right"></span></div>
  <header class="nameplate">
    <h1>The Dawn Edition</h1>
    <div class="motto">The world before breakfast, delivered at six</div>
  </header>
  <div class="dateline">
    <span id="dateline-text"></span>
    <span class="tools">

  <div class="numbers" id="numbers"></div>
  <main>

    <nav class="topics" id="topics" aria-label="Topics"></nav>
    <div class="filter" id="filter"></div>
    <div class="sections" id="sections"></div>
  </main>
  <section class="archive" id="archive" aria-labelledby="archive-title"></section>
  <p class="colophon" id="colophon"></p>
</div>

    { section: "South African Politics", headline: "ANC's NEC sets its coalition mandate, with Mbalula due to announce the outcome today" },
    { section: "South African Politics", headline: "MK, EFF and SACP form a 'Council of the Left' and set terms for backing the ANC" },
    { section: "South African Politics", headline: "Mashaba and Hill-Lewis hold 'frank and productive' talks on the Gauteng metros" },
    { section: "South African Politics", headline: "Matlala ends three days of testimony struggling to explain messages about 'bricks'" },
    { section: "South African Politics", headline: "Intelligence chief tells the commission 'mafia-like' networks are embedded in the state" },
    { section: "South African Politics", headline: "Ramaphosa to lead seven ministers to Silicon Valley in search of AI investment" },
    { section: "Climate & Environment", headline: "COP31 turns to negotiations after leaders set out clashing demands" },
    { section: "Climate & Environment", headline: "Climate change made this week's South African heat up to five times more likely, analysis finds" },
    { section: "Science", headline: "Scientists publish the first cross-species cell atlas of the basal ganglia" },
    { section: "Science", headline: "Perseverance confirms complex organic carbon just below the surface of ancient Martian rock" },
    { section: "Health & Medicine", headline: "WHO's TB report: 1.13 million deaths in 2025 as donor funding falls 14%" },
    { section: "Health & Medicine", headline: "Attacks on health workers are undermining the DRC Ebola response, Africa CDC warns" },
    { section: "Health & Medicine", headline: "Five countries, including the US and Mexico, risk losing measles elimination as PAHO's panel wraps up today" },
    { section: "Economy & Markets", headline: "Brent jumps 3.3% to $95.82 as tanker strikes and Houthi claims rattle supply" },
    { section: "Economy & Markets", headline: "South African mining output falls 10.7% in September, its fifth straight annual decline" },
    { section: "Economy & Markets", headline: "Wall Street slips as Nvidia falls on Huang's exit, while rival chipmakers rally" },
    { section: "Economy & Markets", headline: "Rand softens to about R16.62 as the dollar hits a 19-month high" },
    { section: "Technology & AI", headline: "Jensen Huang resigns as Nvidia chief executive; CFO Colette Kress takes over for now" },
    { section: "Technology & AI", headline: "Anthropic will price its IPO on 18 November and start trading the next day" },
    { section: "Technology & AI", headline: "Advocacy groups sue AI developers to block new models, saying the systems cannot be controlled" }
  ]
};
/* ====================== EDITION DATA: END ====================== */

(function () {
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const count = EDITION.sections.reduce((n, s) => n + s.stories.length, 1);

  $("ear-left").textContent = "Vol. I · No. " + EDITION.number;
  $("ear-right").textContent = "Pretoria · Cape Town · The World";
  $("dateline-text").textContent = EDITION.dateLong + " · " + EDITION.compiled + " · " + count + " stories";


  /* ---------- Source lean ----------
     Approximate political lean of the outlets cited, from general knowledge of public
     media-bias ratings (AllSides / Ad Fontes / MBFC style). It is a rough guide, not a
     verdict: edit the table below to taste. Scale: 0 left, 1 lean left, 2 centre,
     3 lean right, 4 right. Wire services, journals and official bodies count as centre.
     Domains not listed are shown as "not rated" and left out of the ratio. */
  const LEAN = {
    "reuters.com": 2, "apnews.com": 2, "afp.com": 2, "bbc.com": 2, "bbc.co.uk": 2, "ft.com": 2,
    "bloomberg.com": 2, "dw.com": 2, "france24.com": 2, "sky.com": 2, "news.sky.com": 2,
    "economist.com": 2, "pbs.org": 2, "cbsnews.com": 2, "theglobeandmail.com": 2, "japantimes.co.jp": 2,
    "scmp.com": 2, "wsj.com": 2, "rte.ie": 2, "abc.net.au": 2, "rferl.org": 2, "kyivpost.com": 2,
    "timesofisrael.com": 2, "criticalthreats.org": 2, "understandingwar.org": 2,
    "africannewsagency.com": 2, "ewn.co.za": 2, "timeslive.co.za": 2, "sabcnews.com": 2,
    "businessday.co.za": 2, "news24.com": 2, "businesstech.co.za": 2,
    "who.int": 2, "un.org": 2, "nejm.org": 2, "thelancet.com": 2, "jamanetwork.com": 2, "bmj.com": 2,
    "nature.com": 2, "sciencedaily.com": 2, "hcplive.com": 2, "nicd.ac.za": 2, "africacdc.org": 2,
    "nytimes.com": 1, "washingtonpost.com": 1, "aljazeera.com": 1, "npr.org": 1, "nbcnews.com": 1,
    "abcnews.go.com": 1, "cbc.ca": 1, "independent.co.uk": 1, "dailymaverick.co.za": 1, "mg.co.za": 1,
    "thecitizen.co.za": 2, "citizen.co.za": 2, "cnn.com": 1, "politico.com": 1,
    "moneyweb.co.za": 2, "businesslive.co.za": 2, "politicsweb.co.za": 3, "dailyfriend.co.za": 3,
    "netwerk24.com": 3, "rapport.co.za": 3, "thetimes.com": 3, "washingtonexaminer.com": 3,
    "washingtontimes.com": 3, "nationalreview.com": 4, "city-press.news24.com": 2,
    "theguardian.com": 0, "morningstaronline.co.uk": 0, "msnbc.com": 0, "huffpost.com": 0,
    "thetimes.co.uk": 3, "jpost.com": 3, "telegraph.co.uk": 3, "nypost.com": 3, "spectator.co.uk": 3,
    "foxnews.com": 4, "breitbart.com": 4, "dailywire.com": 4
  };
  const LEAN_NAMES = ["Left", "Lean left", "Centre", "Lean right", "Right"];
  const host = (u) => { try { return new URL(u).hostname.replace(/^www\./, "").toLowerCase(); } catch (e) { return ""; } };
  const leanOf = (u) => { let h = host(u); while (h) { if (h in LEAN) return LEAN[h]; const i = h.indexOf("."); if (i < 0) break; h = h.slice(i + 1); } return null; };

  // "left" / "centre" / "right" from the mean lean of the rated sources; "unrated" if none.
  function leanClass(sources) {
    const n = [0, 0, 0, 0, 0];
    (sources || []).forEach((x) => { const v = leanOf(x.url); if (v !== null) n[v]++; });
    const rated = n.reduce((a, b) => a + b, 0);
    if (!rated) return "unrated";
    const mean = (n[1] + 2 * n[2] + 3 * n[3] + 4 * n[4]) / rated;
    return mean < 1.5 ? "left" : mean > 2.5 ? "right" : "centre";
  }

  function leanHTML(sources) {
    const list = sources || [];
    const n = [0, 0, 0, 0, 0];
    list.forEach((x) => { const v = leanOf(x.url); if (v !== null) n[v]++; });
    const rated = n.reduce((a, b) => a + b, 0);
    const head = (verdict, extra) => '<div class="lean-head"><span>Source lean' + (verdict ? ' · <span class="verdict">' + verdict + "</span>" : "") + '</span><span class="rated">' + extra + "</span></div>";
    if (!rated) return '<div class="lean">' + head("", "Sources not rated") + "</div>";
    const pct = (k) => Math.round((k / rated) * 100);
    const left = n[0] + n[1], mid = n[2], right = n[3] + n[4];
    const mean = (n[1] + 2 * n[2] + 3 * n[3] + 4 * n[4]) / rated;
    const verdict = mean < 1.5 ? "Leans left" : mean < 1.85 ? "Slightly left of centre" : mean <= 2.15 ? "Balanced" : mean <= 2.5 ? "Slightly right of centre" : "Leans right";
    const bar = n.map((k, i) => (k ? '<i class="c' + i + '" style="width:' + (k / rated) * 100 + '%" title="' + LEAN_NAMES[i] + ": " + k + '"></i>' : "")).join("");
    const label = "Source lean: " + pct(left) + "% left, " + pct(mid) + "% centre, " + pct(right) + "% right";
    return '<div class="lean">' + head(verdict, rated + " of " + list.length + " sources rated") +
      '<div class="lean-bar" role="img" aria-label="' + label + '">' + bar + "</div>" +
      '<div class="lean-key"><span>Left ' + pct(left) + "%</span><span>Centre " + pct(mid) + "%</span><span>Right " + pct(right) + "%</span></div>" +
      '<div class="lean-note">Approximate outlet ratings, one vote per source. Wire services and journals count as centre.</div></div>';
  }

  function storyHTML(s, isLead) {
    const body = s.body.map((p) => "<p>" + esc(p) + "</p>").join("");
    const why = s.why ? '<div class="why"><b>Why it matters</b>' + esc(s.why) + "</div>" : "";
    const src = s.sources && s.sources.length
      ? '<div class="sources">Sources: ' + s.sources.map((x) => '<a href="' + esc(x.url) + '" target="_blank" rel="noopener">' + esc(x.name) + "</a>").join(" · ") + "</div>"
      : "";
    const H = isLead ? "h2" : "h3";
    return '<details class="story" data-lean="' + leanClass(s.sources) + '"><summary>' +
      (s.kicker ? '<span class="kicker">' + esc(s.kicker) + "</span>" : "") +
      "<" + H + ' class="headline">' + esc(s.headline) + "</" + H + ">" +
      '<p class="dek">' + esc(s.dek) + "</p>" +
      '<span class="more"><span class="closed-label">Read more</span><span class="open-label">Close</span></span>' +
      '</summary><div class="body">' + body + why + src + leanHTML(s.sources) + "</div></details>";
  }

  $("lead").innerHTML = storyHTML(EDITION.lead, true);

  $("index").innerHTML = '<a href="#top" class="back">\u2190 All topics</a>' +
    EDITION.sections.map((s) => '<a href="#' + s.id + '" data-id="' + s.id + '">' + esc(s.name) + "</a>").join("");

  $("topics").innerHTML = EDITION.sections.map((s) => {
    const top = s.stories[0];
    return '<a class="topic" href="#' + s.id + '"><span class="t-name">' + esc(s.name) + "</span>" +
      '<span class="t-count">' + s.stories.length + "<small>" + (s.stories.length === 1 ? "story" : "stories") + "</small></span>" +
      (top ? '<span class="t-top">' + esc(top.headline) + "</span>" : "") +
      '<span class="t-open">Read</span></a>';
  }).join("");

  $("numbers").innerHTML = (EDITION.numbers || []).map((n) =>
    '<div class="num"><div class="k">' + esc(n.k) + '</div><div class="v">' + esc(n.v) + '</div><div class="n">' + esc(n.n) + "</div></div>").join("");

  $("sections").innerHTML = EDITION.sections.map((s) =>
    '<section class="section" id="' + s.id + '" aria-labelledby="h-' + s.id + '">' +
    '<div class="section-head"><h2 id="h-' + s.id + '">' + esc(s.name) + '</h2><span class="count">' + s.stories.length + (s.stories.length === 1 ? " story" : " stories") + "</span></div>" +
    s.stories.map((st) => storyHTML(st, false)).join("") + "</section>").join("");

  let arch = '<h2 id="archive-title">Yesterday\'s front page</h2>';
  if (PREVIOUS && PREVIOUS.items && PREVIOUS.items.length) {
    arch += '<p class="sources" style="margin:0 0 8px">' + esc(PREVIOUS.dateLong) + "</p><ul>" +
      PREVIOUS.items.map((i) => "<li><span>" + esc(i.section) + "</span>" + esc(i.headline) + "</li>").join("") + "</ul>";
  } else {
    arch += '<p class="empty">This is the first edition. From tomorrow, the previous day\'s headlines will be listed here.</p>';
  }
  $("archive").innerHTML = arch;

  $("colophon").textContent = "Edition " + EDITION.number + " · Refreshed daily at 06:00 SAST · Click any headline to read more";

  // Home shows the lead and the topic grid; #<section-id> shows just that topic.
  function route() {
    const id = decodeURIComponent(location.hash.slice(1));
    const sec = id && document.querySelector('.section[id="' + id + '"]');
    document.body.classList.toggle("in-topic", !!sec);
    document.querySelectorAll(".section").forEach((el) => el.classList.toggle("active", el === sec));
    document.querySelectorAll("#index a[data-id]").forEach((a) => {
      const on = a.dataset.id === id;
      a.classList.toggle("on", on);
      if (on) a.scrollIntoView({ block: "nearest", inline: "center" });
    });
    window.scrollTo(0, 0);
  }
  window.addEventListener("hashchange", route);

  // ---------- Lean filter ----------
  const FILTERS = [
    ["all", "All", () => true],
    ["cr", "Centre & right", (l) => l === "centre" || l === "right"],
    ["left", "Left", (l) => l === "left"],
    ["centre", "Centre", (l) => l === "centre"],
    ["right", "Right", (l) => l === "right"]
  ];
  let filterKey = "all";
  try { const k = localStorage.getItem("dawn-lean"); if (FILTERS.some((f) => f[0] === k)) filterKey = k; } catch (e) {}

  function applyFilter() {
    const sec = document.querySelector(".section.active");
    const fbox = $("filter");
    if (!sec) { fbox.innerHTML = ""; return; }
    const stories = Array.from(sec.querySelectorAll("details.story"));
    const fn = FILTERS.find((f) => f[0] === filterKey)[2];
    let shown = 0;
    stories.forEach((d) => { const ok = fn(d.dataset.lean); d.classList.toggle("filtered-out", !ok); if (ok) shown++; });
    const chips = FILTERS.map((f) => {
      const c = stories.filter((d) => f[2](d.dataset.lean)).length;
      return '<button type="button" data-f="' + f[0] + '" aria-pressed="' + (f[0] === filterKey) + '">' + f[1] + '<span class="n">' + c + "</span></button>";
    }).join("");
    const unrated = stories.filter((d) => d.dataset.lean === "unrated").length;
    let status = "";
    if (filterKey !== "all") {
      status = "Showing " + shown + " of " + stories.length + " stories" + (unrated ? " (" + unrated + " with unrated sources only appear under All)" : "") + ". " +
        '<button type="button" data-f="all">Show all</button>';
      if (!shown) status = "No stories match this filter in this topic. " + '<button type="button" data-f="all">Show all</button>';
    }
    fbox.innerHTML = '<div class="filter-label">Filter by source lean</div><div class="filter-chips">' + chips + "</div>" + (status ? '<div class="filter-status">' + status + "</div>" : "");
  }
  $("filter").addEventListener("click", (e) => {
    const b = e.target.closest("button[data-f]");
    if (!b) return;
    filterKey = b.dataset.f;
    try { localStorage.setItem("dawn-lean", filterKey); } catch (err) {}
    applyFilter();
  });
  window.addEventListener("hashchange", applyFilter);
  route();
  applyFilter();

  const all = () => document.querySelectorAll("details.story");
  $("expand-all").addEventListener("click", () => all().forEach((d) => (d.open = true)));
  $("collapse-all").addEventListener("click", () => all().forEach((d) => (d.open = false)));
})();
</script>

if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js"); });
}
</script>
